# Backup for the on-visit results sync: pings the site every 10 minutes during March and April
# so payouts post even when nobody has the site open. Needs repository secrets APP_URL and CRON_SECRET.
name: Sync tournament results

on:
  schedule:
    - cron: "*/10 * * 3,4 *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to sync with ESPN
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set; skipping"; exit 0; fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sync"
